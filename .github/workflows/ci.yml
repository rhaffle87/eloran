name: CI — Lint, Test, E2E & Build

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · E2E · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Secret Hygiene Guard
        run: npm run check:secrets

      - name: ESLint (zero warnings gate)
        run: npm run lint -- --max-warnings 0

      - name: Check Provenance (non-blocking drift monitor)
        run: npm run check:provenance
        continue-on-error: true

      - name: Vitest unit tests
        run: npm run test -- --run --reporter=verbose

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          test -d dist && echo "✅ dist/ directory exists"
          test -f dist/index.html && echo "✅ dist/index.html exists"
