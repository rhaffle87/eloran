services:
  simuloran:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simuloran-app
    image: simuloran:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
